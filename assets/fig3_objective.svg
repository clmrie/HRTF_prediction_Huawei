<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="sphereClip"><circle cx="880" cy="165" r="110"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="#ffffff"/>

  <!-- ============ (a) critical-band weighting ============ -->
  <text x="320" y="30" font-size="16" fill="#111827" text-anchor="middle" font-weight="bold">(a) Critical-band frequency weighting</text>

  <g>
    <line x1="60" y1="250" x2="580" y2="250" stroke="#374151" stroke-width="1.6"/>
    <line x1="60" y1="250" x2="60" y2="40" stroke="#374151" stroke-width="1.6"/>
    <!-- ticks -->
    <g stroke="#374151" stroke-width="1.4">
      <line x1="60" y1="250" x2="60" y2="256"/><line x1="185" y1="250" x2="185" y2="256"/>
      <line x1="310" y1="250" x2="310" y2="256"/><line x1="435" y1="250" x2="435" y2="256"/>
      <line x1="560" y1="250" x2="560" y2="256"/>
    </g>
    <g font-size="12.5" fill="#374151" text-anchor="middle">
      <text x="60" y="274">0</text><text x="185" y="274">6</text><text x="310" y="274">12</text>
      <text x="435" y="274">18</text><text x="560" y="274">24</text>
    </g>
    <text x="320" y="300" font-size="13.5" fill="#374151" text-anchor="middle">frequency (kHz)</text>
    <text x="34" y="150" font-size="13.5" fill="#374151" text-anchor="middle" transform="rotate(-90 34 150)">weight w(f)</text>

    <!-- curve (computed from metrics.py: w ∝ 1/(25 + 75(1 + 1.4 f²)^0.69)) -->
    <polygon points="60,250 60.0,40.0 63.9,45.2 67.8,58.9 71.7,77.3 75.6,96.7 79.5,114.9 83.4,131.1 87.3,145.0 91.2,156.8 95.2,166.8 99.1,175.2 103.0,182.5 106.9,188.6 110.8,194.0 114.7,198.6 118.6,202.6 122.5,206.2 126.4,209.3 130.3,212.1 134.2,214.5 138.1,216.8 142.0,218.7 145.9,220.5 149.8,222.2 153.8,223.7 157.7,225.0 161.6,226.3 165.5,227.4 169.4,228.4 177.2,230.3 185.0,231.9 192.8,233.3 200.6,234.5 208.4,235.6 216.2,236.6 224.1,237.4 231.9,238.2 239.7,238.9 247.5,239.5 255.3,240.1 263.1,240.6 270.9,241.0 278.8,241.5 286.6,241.9 294.4,242.2 302.2,242.6 310.0,242.9 325.6,243.5 341.2,243.9 356.9,244.4 372.5,244.8 388.1,245.1 403.8,245.4 419.4,245.7 435.0,245.9 450.6,246.1 466.2,246.3 481.9,246.5 497.5,246.7 513.1,246.8 528.8,247.0 544.4,247.1 560.0,247.2 560,250" fill="#DBEAFE" stroke="none"/>
    <polyline points="60.0,40.0 63.9,45.2 67.8,58.9 71.7,77.3 75.6,96.7 79.5,114.9 83.4,131.1 87.3,145.0 91.2,156.8 95.2,166.8 99.1,175.2 103.0,182.5 106.9,188.6 110.8,194.0 114.7,198.6 118.6,202.6 122.5,206.2 126.4,209.3 130.3,212.1 134.2,214.5 138.1,216.8 142.0,218.7 145.9,220.5 149.8,222.2 153.8,223.7 157.7,225.0 161.6,226.3 165.5,227.4 169.4,228.4 177.2,230.3 185.0,231.9 192.8,233.3 200.6,234.5 208.4,235.6 216.2,236.6 224.1,237.4 231.9,238.2 239.7,238.9 247.5,239.5 255.3,240.1 263.1,240.6 270.9,241.0 278.8,241.5 286.6,241.9 294.4,242.2 302.2,242.6 310.0,242.9 325.6,243.5 341.2,243.9 356.9,244.4 372.5,244.8 388.1,245.1 403.8,245.4 419.4,245.7 435.0,245.9 450.6,246.1 466.2,246.3 481.9,246.5 497.5,246.7 513.1,246.8 528.8,247.0 544.4,247.1 560.0,247.2" fill="none" stroke="#2563EB" stroke-width="2.6"/>
    <text x="330" y="200" font-size="13" fill="#1E40AF" font-family="Menlo, Consolas, monospace">w(f) ∝ 1 / Δcb(f)</text>
    <text x="330" y="222" font-size="12" fill="#1E40AF" font-family="Menlo, Consolas, monospace">Δcb = 25 + 75(1 + 1.4 f²)^0.69</text>
  </g>

  <!-- ============ (b) evaluation region ============ -->
  <text x="880" y="30" font-size="16" fill="#111827" text-anchor="middle" font-weight="bold">(b) Perceptually weighted spectral loss</text>

  <g>
    <circle cx="880" cy="165" r="110" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <!-- shaded ±30° elevation band -->
    <rect x="770" y="110" width="220" height="110" fill="#BBF7D0" opacity="0.75" clip-path="url(#sphereClip)"/>
    <ellipse cx="880" cy="110" rx="95" ry="18" fill="none" stroke="#16A34A" stroke-width="1.6" clip-path="url(#sphereClip)"/>
    <ellipse cx="880" cy="220" rx="95" ry="18" fill="none" stroke="#16A34A" stroke-width="1.6" clip-path="url(#sphereClip)"/>
    <ellipse cx="880" cy="165" rx="110" ry="24" fill="none" stroke="#A78BFA" stroke-width="1.2"/>
    <!-- head -->
    <circle cx="880" cy="165" r="16" fill="#EDE9FE" stroke="#4C1D95" stroke-width="1.6"/>
    <text x="1012" y="122" font-size="13" fill="#166534">+30°</text>
    <text x="1012" y="228" font-size="13" fill="#166534">−30°</text>
    <text x="880" y="304" font-size="13.5" fill="#166534" text-anchor="middle">loss evaluated on |elevation| ≤ 30° — where localization matters most</text>
  </g>

  <!-- MSD formula -->
  <rect x="656" y="318" width="450" height="0" fill="none"/>
  <text x="320" y="340" font-size="14" fill="#7F1D1D" text-anchor="middle" font-family="Menlo, Consolas, monospace">MSD = 10·log₁₀ 𝔼[ w(f) · ( |H_true| − |H_pred| )² ]  dB</text>
</svg>
