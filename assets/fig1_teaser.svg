<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1520" height="470" fill="#ffffff"/>

  <!-- ================= (a) input photos ================= -->
  <text x="250" y="44" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold">(a) A handful of ear photos</text>

  <!-- big example photo -->
  <rect x="60" y="80" width="130" height="130" rx="10" fill="#E5E7EB" stroke="#374151" stroke-width="1.8"/>
  <path d="M 108 106 C 138 96, 156 118, 151 144 C 147 164, 132 173, 119 182 C 108 189, 95 184, 92 170 M 116 122 C 132 119, 140 132, 136 148 C 133 160, 124 165, 116 169" fill="none" stroke="#374151" stroke-width="3.2" stroke-linecap="round"/>
  <text x="125" y="232" font-size="13.5" fill="#374151" text-anchor="middle">grayscale, 256 × 256</text>

  <!-- three sparsity regimes -->
  <g>
    <text x="238" y="100" font-size="13.5" fill="#111827" font-weight="bold">19 views / ear</text>
    <g fill="#F3F4F6" stroke="#6B7280" stroke-width="1.1">
      <rect x="238" y="108" width="18" height="18" rx="3"/><rect x="260" y="108" width="18" height="18" rx="3"/><rect x="282" y="108" width="18" height="18" rx="3"/><rect x="304" y="108" width="18" height="18" rx="3"/><rect x="326" y="108" width="18" height="18" rx="3"/><rect x="348" y="108" width="18" height="18" rx="3"/><rect x="370" y="108" width="18" height="18" rx="3"/><rect x="392" y="108" width="18" height="18" rx="3"/><rect x="414" y="108" width="18" height="18" rx="3"/><rect x="436" y="108" width="18" height="18" rx="3"/>
      <rect x="238" y="130" width="18" height="18" rx="3"/><rect x="260" y="130" width="18" height="18" rx="3"/><rect x="282" y="130" width="18" height="18" rx="3"/><rect x="304" y="130" width="18" height="18" rx="3"/><rect x="326" y="130" width="18" height="18" rx="3"/><rect x="348" y="130" width="18" height="18" rx="3"/><rect x="370" y="130" width="18" height="18" rx="3"/><rect x="392" y="130" width="18" height="18" rx="3"/><rect x="414" y="130" width="18" height="18" rx="3"/>
    </g>

    <text x="238" y="182" font-size="13.5" fill="#111827" font-weight="bold">7 views / ear</text>
    <g fill="#F3F4F6" stroke="#6B7280" stroke-width="1.1">
      <rect x="238" y="190" width="18" height="18" rx="3"/><rect x="260" y="190" width="18" height="18" rx="3"/><rect x="282" y="190" width="18" height="18" rx="3"/><rect x="304" y="190" width="18" height="18" rx="3"/><rect x="326" y="190" width="18" height="18" rx="3"/><rect x="348" y="190" width="18" height="18" rx="3"/><rect x="370" y="190" width="18" height="18" rx="3"/>
    </g>

    <text x="238" y="244" font-size="13.5" fill="#111827" font-weight="bold">3 views / ear</text>
    <g fill="#F3F4F6" stroke="#6B7280" stroke-width="1.1">
      <rect x="238" y="252" width="18" height="18" rx="3"/><rect x="260" y="252" width="18" height="18" rx="3"/><rect x="282" y="252" width="18" height="18" rx="3"/>
    </g>
  </g>

  <text x="250" y="316" font-size="13.5" fill="#6B7280" text-anchor="middle">no anechoic chamber · no 3-D scan · no manual measurements</text>

  <!-- brace / arrows into model -->
  <path d="M 470 140 C 520 140, 520 200, 560 200" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M 400 199 C 480 199, 500 200, 560 200" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M 314 261 C 460 261, 500 200, 560 202" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#tarr)"/>

  <!-- ================= (b) single network ================= -->
  <text x="722" y="44" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold">(b) One network, any view count</text>

  <g>
    <rect x="576" y="120" width="292" height="160" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/>
    <!-- mini pipeline inside -->
    <rect x="596" y="150" width="72" height="56" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
    <text x="632" y="174" font-size="12.5" fill="#1E3A8A" text-anchor="middle" font-weight="bold">CNN</text>
    <text x="632" y="192" font-size="11" fill="#1E40AF" text-anchor="middle">per view</text>

    <line x1="668" y1="178" x2="688" y2="178" stroke="#374151" stroke-width="1.8" marker-end="url(#tarr)"/>

    <rect x="690" y="150" width="72" height="56" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/>
    <text x="726" y="174" font-size="12.5" fill="#14532D" text-anchor="middle" font-weight="bold">BiLSTM</text>
    <text x="726" y="192" font-size="11" fill="#166534" text-anchor="middle">fuse views</text>

    <line x1="762" y1="178" x2="782" y2="178" stroke="#374151" stroke-width="1.8" marker-end="url(#tarr)"/>

    <rect x="784" y="150" width="64" height="56" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
    <text x="816" y="174" font-size="12.5" fill="#78350F" text-anchor="middle" font-weight="bold">LSTM</text>
    <text x="816" y="192" font-size="11" fill="#92400E" text-anchor="middle">expand</text>

    <text x="722" y="240" font-size="13" fill="#1E40AF" text-anchor="middle">image → HRTF, end-to-end</text>
    <text x="722" y="260" font-size="13" fill="#1E40AF" text-anchor="middle">trained on the perceptual metric</text>
  </g>

  <line x1="868" y1="200" x2="930" y2="200" stroke="#374151" stroke-width="2.2" marker-end="url(#tarr)"/>

  <!-- ================= (c) output ================= -->
  <text x="1190" y="44" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold">(c) Full-sphere personalized HRTF</text>

  <!-- direction sphere -->
  <g>
    <circle cx="1035" cy="200" r="82" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <ellipse cx="1035" cy="200" rx="82" ry="26" fill="none" stroke="#A78BFA" stroke-width="1.3"/>
    <ellipse cx="1035" cy="166" rx="66" ry="20" fill="none" stroke="#C4B5FD" stroke-width="1.1"/>
    <ellipse cx="1035" cy="238" rx="64" ry="19" fill="none" stroke="#C4B5FD" stroke-width="1.1"/>
    <ellipse cx="1035" cy="200" rx="30" ry="82" fill="none" stroke="#C4B5FD" stroke-width="1.1"/>
    <g fill="#6D28D9">
      <circle cx="1035" cy="118" r="3"/><circle cx="985" cy="152" r="3"/><circle cx="1085" cy="152" r="3"/>
      <circle cx="953" cy="200" r="3"/><circle cx="1117" cy="200" r="3"/><circle cx="1035" cy="226" r="3"/>
      <circle cx="988" cy="247" r="3"/><circle cx="1082" cy="247" r="3"/><circle cx="1005" cy="180" r="3"/>
      <circle cx="1065" cy="180" r="3"/><circle cx="1035" cy="282" r="3"/><circle cx="969" cy="176" r="3"/>
      <circle cx="1101" cy="176" r="3"/><circle cx="1010" cy="222" r="3"/><circle cx="1060" cy="222" r="3"/>
    </g>
    <!-- head in the middle -->
    <circle cx="1035" cy="200" r="15" fill="#EDE9FE" stroke="#4C1D95" stroke-width="1.6"/>
    <text x="1035" y="310" font-size="13.5" fill="#4C1D95" text-anchor="middle">793 directions × 2 ears</text>
  </g>

  <!-- magnitude spectra -->
  <g>
    <rect x="1180" y="110" width="290" height="150" rx="8" fill="#FAFAFA" stroke="#9CA3AF" stroke-width="1.3"/>
    <line x1="1204" y1="236" x2="1450" y2="236" stroke="#374151" stroke-width="1.4"/>
    <line x1="1204" y1="236" x2="1204" y2="128" stroke="#374151" stroke-width="1.4"/>
    <path d="M 1204 196 C 1230 190, 1250 178, 1272 172 C 1296 166, 1310 160, 1330 164 C 1348 168, 1354 186, 1364 200 C 1372 211, 1378 208, 1388 196 C 1400 182, 1414 186, 1428 194 C 1438 200, 1444 206, 1450 210" fill="none" stroke="#2563EB" stroke-width="2.4"/>
    <path d="M 1204 202 C 1232 198, 1252 188, 1274 180 C 1298 172, 1314 168, 1334 174 C 1350 179, 1352 198, 1360 214 C 1367 227, 1376 222, 1386 208 C 1398 192, 1416 196, 1430 204 C 1440 210, 1446 214, 1450 218" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="7 4"/>
    <text x="1327" y="255" font-size="12" fill="#374151" text-anchor="middle">frequency → 24 kHz</text>
    <text x="1196" y="182" font-size="12" fill="#374151" text-anchor="middle" transform="rotate(-90 1196 182)">|HRTF| (dB)</text>
    <text x="1252" y="146" font-size="12" fill="#2563EB">left ear</text>
    <text x="1320" y="146" font-size="12" fill="#DC2626">right ear</text>
  </g>

  <!-- headphones / spatial audio -->
  <g>
    <path d="M 1272 320 C 1272 292, 1382 292, 1382 320" fill="none" stroke="#111827" stroke-width="3.4" stroke-linecap="round"/>
    <rect x="1262" y="318" width="22" height="34" rx="8" fill="#111827"/>
    <rect x="1370" y="318" width="22" height="34" rx="8" fill="#111827"/>
    <path d="M 1240 322 C 1232 330, 1232 342, 1240 350 M 1228 314 C 1216 326, 1216 346, 1228 358" fill="none" stroke="#6B7280" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 1414 322 C 1422 330, 1422 342, 1414 350 M 1426 314 C 1438 326, 1438 346, 1426 358" fill="none" stroke="#6B7280" stroke-width="2.2" stroke-linecap="round"/>
    <text x="1327" y="382" font-size="13.5" fill="#111827" text-anchor="middle">personalized spatial audio</text>
  </g>

  <!-- SOFA file tag -->
  <rect x="1002" y="336" width="66" height="30" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.4"/>
  <text x="1035" y="356" font-size="13" fill="#374151" text-anchor="middle" font-family="Menlo, Consolas, monospace">.sofa</text>

  <text x="760" y="440" font-size="14" fill="#6B7280" text-anchor="middle">Personalized HRTFs from photos alone — replacing 30–60 min of anechoic-chamber measurement with a few seconds of inference.</text>
</svg>
