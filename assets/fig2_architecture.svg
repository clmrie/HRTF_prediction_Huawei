<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Architecture: shared ResNet-50 encodes each view, a BiLSTM fuses them into one identity code, an expansion LSTM and shared MLP decode the full HRIR tensor, trained on the Mean Spectral Distortion metric.">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#1F2937"/>
    </marker>
    <marker id="a2r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>

  <!-- ===== input ===== -->
  <rect x="34" y="112" width="66" height="66" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="24" y="122" width="66" height="66" rx="8" fill="#DFE3E8" stroke="#374151" stroke-width="2.2"/>
  <path d="M46 140 C67 133, 80 149, 76 167 C73 180, 63 187, 54 193 C46 198, 37 194, 35 185
           M52 151 C63 149, 70 159, 66 170 C64 178, 58 182, 52 185"
        fill="none" stroke="#1F2937" stroke-width="3" stroke-linecap="round"/>
  <text x="60" y="216" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle">2 ears</text>
  <text x="60" y="236" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle">× V views</text>

  <line x1="106" y1="150" x2="144" y2="150" stroke="#1F2937" stroke-width="2.6" marker-end="url(#a2)"/>

  <!-- ===== ResNet-50 ===== -->
  <rect x="150" y="88" width="152" height="124" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
  <text x="226" y="132" font-size="19" font-weight="700" fill="#1E3A8A" text-anchor="middle">ResNet-50</text>
  <text x="226" y="158" font-size="15" fill="#1E40AF" text-anchor="middle">shared across</text>
  <text x="226" y="180" font-size="15" fill="#1E40AF" text-anchor="middle">all views</text>
  <text x="226" y="238" font-size="14" fill="#6B7280" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">2V × 2048</text>

  <line x1="308" y1="150" x2="346" y2="150" stroke="#1F2937" stroke-width="2.6" marker-end="url(#a2)"/>

  <!-- ===== cross-view BiLSTM ===== -->
  <rect x="352" y="88" width="152" height="124" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/>
  <text x="428" y="126" font-size="19" font-weight="700" fill="#14532D" text-anchor="middle">Cross-view</text>
  <text x="428" y="149" font-size="19" font-weight="700" fill="#14532D" text-anchor="middle">BiLSTM</text>
  <text x="428" y="177" font-size="15" fill="#166534" text-anchor="middle">fuses any</text>
  <text x="428" y="197" font-size="15" fill="#166534" text-anchor="middle">view count</text>
  <text x="428" y="238" font-size="14" fill="#6B7280" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">z ∈ R²⁰⁴⁸</text>

  <line x1="510" y1="150" x2="548" y2="150" stroke="#1F2937" stroke-width="2.6" marker-end="url(#a2)"/>

  <!-- ===== expansion LSTM ===== -->
  <rect x="554" y="88" width="152" height="124" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
  <text x="630" y="126" font-size="19" font-weight="700" fill="#78350F" text-anchor="middle">Expansion</text>
  <text x="630" y="149" font-size="19" font-weight="700" fill="#78350F" text-anchor="middle">LSTM</text>
  <text x="630" y="177" font-size="15" fill="#92400E" text-anchor="middle">one code →</text>
  <text x="630" y="197" font-size="15" fill="#92400E" text-anchor="middle">1586 rows</text>
  <text x="630" y="238" font-size="14" fill="#6B7280" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">1586 × 2048</text>

  <line x1="712" y1="150" x2="738" y2="150" stroke="#1F2937" stroke-width="2.6" marker-end="url(#a2)"/>

  <!-- ===== shared MLP ===== -->
  <rect x="744" y="88" width="112" height="124" rx="14" fill="#FCE7F3" stroke="#DB2777" stroke-width="3"/>
  <text x="800" y="132" font-size="19" font-weight="700" fill="#831843" text-anchor="middle">MLP</text>
  <text x="800" y="158" font-size="15" fill="#9D174D" text-anchor="middle">row-wise,</text>
  <text x="800" y="180" font-size="15" fill="#9D174D" text-anchor="middle">shared</text>

  <line x1="862" y1="150" x2="886" y2="150" stroke="#1F2937" stroke-width="2.6" marker-end="url(#a2)"/>

  <!-- ===== output ===== -->
  <polygon points="890,126 928,126 928,178 890,178" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
  <polygon points="890,126 904,112 942,112 928,126" fill="#DDD6FE" stroke="#7C3AED" stroke-width="2.5"/>
  <polygon points="928,126 942,112 942,164 928,178" fill="#C4B5FD" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="912" y="216" font-size="15" font-weight="600" fill="#4C1D95" text-anchor="middle">HRIRs</text>
  <text x="912" y="238" font-size="13" fill="#6B7280" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">793×2×256</text>

  <!-- ===== loss feedback ===== -->
  <rect x="286" y="292" width="388" height="72" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="480" y="322" font-size="18" font-weight="700" fill="#7F1D1D" text-anchor="middle">Mean Spectral Distortion loss</text>
  <text x="480" y="348" font-size="15" fill="#991B1B" text-anchor="middle">the challenge metric, optimized directly</text>

  <path d="M912 254 L912 328 L680 328" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a2r)"/>
  <path d="M280 328 L175 328 L175 218" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a2r)"/>
</svg>
