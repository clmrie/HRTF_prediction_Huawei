<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#374151"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1560" height="620" fill="#ffffff"/>

  <!-- ============ INPUT: multi-view pinna images ============ -->
  <g>
    <!-- left-ear stack -->
    <rect x="60" y="150" width="86" height="86" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.4"/>
    <rect x="50" y="160" width="86" height="86" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.4"/>
    <rect x="40" y="170" width="86" height="86" rx="8" fill="#E5E7EB" stroke="#374151" stroke-width="1.6"/>
    <path d="M 71 189 C 92 181, 105 197, 101 216 C 98 230, 88 237, 79 243 C 71 248, 62 244, 60 235 M 77 200 C 88 198, 94 208, 91 219 C 89 227, 83 231, 77 234" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <text x="83" y="278" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">left ear</text>

    <!-- right-ear stack -->
    <rect x="60" y="310" width="86" height="86" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.4"/>
    <rect x="50" y="320" width="86" height="86" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.4"/>
    <rect x="40" y="330" width="86" height="86" rx="8" fill="#E5E7EB" stroke="#374151" stroke-width="1.6"/>
    <path d="M 95 349 C 74 341, 61 357, 65 376 C 68 390, 78 397, 87 403 C 95 408, 104 404, 106 395 M 89 360 C 78 358, 72 368, 75 379 C 77 387, 83 391, 89 394" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <text x="83" y="438" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">right ear</text>

    <text x="95" y="478" font-size="13.5" fill="#374151" text-anchor="middle">grayscale photos</text>
    <text x="95" y="498" font-size="13" fill="#374151" text-anchor="middle">2 ears × V views, 256 × 256</text>
    <text x="95" y="520" font-size="13" fill="#374151" text-anchor="middle" font-family="Menlo, Consolas, monospace">V ∈ {19, 7, 3}</text>
  </g>

  <line x1="152" y1="290" x2="222" y2="290" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============ ResNet-50 encoder ============ -->
  <g>
    <rect x="232" y="170" width="170" height="240" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="317" y="216" font-size="18" fill="#1E3A8A" text-anchor="middle" font-weight="bold">ResNet-50</text>
    <text x="317" y="238" font-size="15" fill="#1E3A8A" text-anchor="middle">encoder</text>
    <line x1="254" y1="256" x2="380" y2="256" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="317" y="280" font-size="13" fill="#1E40AF" text-anchor="middle">1-channel conv1</text>
    <text x="317" y="300" font-size="13" fill="#1E40AF" text-anchor="middle">ImageNet pretrained</text>
    <text x="317" y="320" font-size="13" fill="#1E40AF" text-anchor="middle">weights shared</text>
    <text x="317" y="340" font-size="13" fill="#1E40AF" text-anchor="middle">across all 2V views</text>
    <line x1="254" y1="358" x2="380" y2="358" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="317" y="382" font-size="13" fill="#1E40AF" text-anchor="middle">global avg-pool</text>
  </g>

  <line x1="402" y1="290" x2="480" y2="290" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="441" y="272" font-size="12.5" fill="#374151" text-anchor="middle" font-family="Menlo, Consolas, monospace">2V×2048</text>

  <!-- ============ Cross-view BiLSTM ============ -->
  <g>
    <rect x="490" y="170" width="185" height="240" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
    <text x="582" y="212" font-size="17" fill="#14532D" text-anchor="middle" font-weight="bold">Cross-view</text>
    <text x="582" y="234" font-size="17" fill="#14532D" text-anchor="middle" font-weight="bold">BiLSTM</text>
    <line x1="514" y1="252" x2="651" y2="252" stroke="#86EFAC" stroke-width="1.5"/>
    <text x="582" y="276" font-size="13" fill="#166534" text-anchor="middle">4 layers · hidden 1024</text>
    <text x="582" y="296" font-size="13" fill="#166534" text-anchor="middle">bidirectional</text>
    <g stroke="#16A34A" stroke-width="1.4" fill="#F0FDF4">
      <rect x="514" y="316" width="26" height="22" rx="4"/>
      <rect x="546" y="316" width="26" height="22" rx="4"/>
      <rect x="578" y="316" width="26" height="22" rx="4"/>
      <rect x="610" y="316" width="26" height="22" rx="4"/>
    </g>
    <path d="M 540 322 h 4 M 572 322 h 4 M 604 322 h 4" stroke="#16A34A" stroke-width="1.6"/>
    <path d="M 540 332 h 4 M 572 332 h 4 M 604 332 h 4" stroke="#16A34A" stroke-width="1.6"/>
    <text x="582" y="362" font-size="12.5" fill="#166534" text-anchor="middle">views read as a sequence</text>
    <text x="582" y="382" font-size="12.5" fill="#166534" text-anchor="middle">→ any view count V</text>
  </g>

  <line x1="677" y1="290" x2="785" y2="290" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="731" y="252" font-size="12.5" fill="#374151" text-anchor="middle">identity code</text>
  <text x="731" y="272" font-size="12.5" fill="#374151" text-anchor="middle" font-family="Menlo, Consolas, monospace">z ∈ ℝ²⁰⁴⁸</text>

  <!-- ============ Spatial expansion LSTM ============ -->
  <g>
    <rect x="795" y="170" width="200" height="240" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="895" y="212" font-size="17" fill="#78350F" text-anchor="middle" font-weight="bold">Spatial expansion</text>
    <text x="895" y="234" font-size="17" fill="#78350F" text-anchor="middle" font-weight="bold">BiLSTM</text>
    <line x1="819" y1="252" x2="971" y2="252" stroke="#FCD34D" stroke-width="1.5"/>
    <text x="895" y="276" font-size="13" fill="#92400E" text-anchor="middle">2 layers · hidden 793</text>
    <text x="895" y="296" font-size="13" fill="#92400E" text-anchor="middle">bidirectional</text>
    <text x="895" y="326" font-size="12.5" fill="#92400E" text-anchor="middle">z unrolled as a</text>
    <text x="895" y="344" font-size="12.5" fill="#92400E" text-anchor="middle">2048-step scalar sequence,</text>
    <text x="895" y="362" font-size="12.5" fill="#92400E" text-anchor="middle">recurrently expanded, then</text>
    <text x="895" y="380" font-size="12.5" fill="#92400E" text-anchor="middle">reshaped to 1586 rows</text>
  </g>

  <line x1="997" y1="290" x2="1113" y2="290" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1055" y="234" font-size="12.5" fill="#374151" text-anchor="middle" font-family="Menlo, Consolas, monospace">1586×2048</text>
  <text x="1055" y="254" font-size="11.5" fill="#374151" text-anchor="middle">one 2048-dim row per</text>
  <text x="1055" y="270" font-size="11.5" fill="#374151" text-anchor="middle">output channel</text>

  <!-- ============ MLP head ============ -->
  <g>
    <rect x="1123" y="196" width="150" height="188" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <text x="1198" y="238" font-size="17" fill="#831843" text-anchor="middle" font-weight="bold">Shared MLP</text>
    <line x1="1145" y1="256" x2="1251" y2="256" stroke="#F9A8D4" stroke-width="1.5"/>
    <text x="1198" y="282" font-size="13" fill="#9D174D" text-anchor="middle" font-family="Menlo, Consolas, monospace">2048→512→256</text>
    <text x="1198" y="308" font-size="12.5" fill="#9D174D" text-anchor="middle">ReLU · dropout 0.3</text>
    <text x="1198" y="338" font-size="12.5" fill="#9D174D" text-anchor="middle">applied row-wise,</text>
    <text x="1198" y="356" font-size="12.5" fill="#9D174D" text-anchor="middle">weights shared</text>
  </g>

  <line x1="1273" y1="290" x2="1337" y2="290" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============ Output cube: HRIRs ============ -->
  <g>
    <polygon points="1352,240 1462,240 1462,350 1352,350" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <polygon points="1352,240 1384,212 1494,212 1462,240" fill="#DDD6FE" stroke="#7C3AED" stroke-width="2"/>
    <polygon points="1462,240 1494,212 1494,322 1462,350" fill="#C4B5FD" stroke="#7C3AED" stroke-width="2"/>
    <text x="1407" y="302" font-size="16" fill="#4C1D95" text-anchor="middle" font-weight="bold">HRIRs</text>
    <text x="1407" y="376" font-size="13.5" fill="#4C1D95" text-anchor="middle" font-family="Menlo, Consolas, monospace">793 × 2 × 256</text>
    <text x="1407" y="396" font-size="12.5" fill="#6D28D9" text-anchor="middle">directions × ears × taps</text>
    <text x="1407" y="416" font-size="12.5" fill="#6D28D9" text-anchor="middle">→ SOFA file</text>
  </g>

  <!-- ============ Training objective ============ -->
  <g>
    <path d="M 1407 430 L 1407 468" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
    <rect x="1276" y="478" width="262" height="106" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
    <text x="1407" y="506" font-size="15.5" fill="#7F1D1D" text-anchor="middle" font-weight="bold">Mean Spectral Distortion loss</text>
    <text x="1407" y="530" font-size="12.5" fill="#991B1B" text-anchor="middle" font-family="Menlo, Consolas, monospace">rFFT → |·| → weighted MSE (dB)</text>
    <text x="1407" y="552" font-size="12.5" fill="#991B1B" text-anchor="middle">critical-band perceptual weighting</text>
    <text x="1407" y="570" font-size="12.5" fill="#991B1B" text-anchor="middle">elevations −30°…+30°</text>
    <path d="M 1276 531 L 317 531 L 317 418" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrRed)" fill="none"/>
    <text x="760" y="522" font-size="13" fill="#DC2626" text-anchor="middle">trained end-to-end on the evaluation metric</text>
  </g>
</svg>
